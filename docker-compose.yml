# Local backend for the MMO: Nakama (the game server / source of truth) backed by
# PostgreSQL. Run `docker compose up -d` and start a game server; it connects on
# 127.0.0.1:7350 with the default key ("defaultkey") from BackendSettings.
services:
  nakama:
    image: heroiclabs/nakama:3.42.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /nakama/nakama migrate up
        --database.address postgres:password@db:5432/nakama &&
        /nakama/nakama
        --database.address postgres:password@db:5432/nakama
        --session.refresh_token_expiry_sec 2592000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7349:7349"   # gRPC
      - "7350:7350"   # HTTP API (what NakamaPlayerRepository talks to)
      - "7351:7351"   # developer console
    volumes:
      # Loads the Lua runtime modules: social_notify (the cross-zone social bus) and friends.
      - ./nakama/modules:/nakama/data/modules:ro
    restart: unless-stopped

  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      # postgres:18 moved its data dir to /var/lib/postgresql and errors out when the mounted
      # /data subfolder already has a PG_VERSION; mount the parent so the container provisions it.
      - nakama-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    ports:
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      RAID_IMAGE: mmo-raid-server:local
      HEALTH_TIMEOUT_SECONDS: "90"
      # Deterministic host-port range for raid instances (lowest free first). Replaces the old
      # `-p 0:7777` ephemeral mapping, whose random port became a dead zone address once the
      # container was torn down.
      RAID_PORT_RANGE_START: "7800"
      RAID_PORT_RANGE_END: "7899"
    restart: unless-stopped

volumes:
  nakama-pgdata: