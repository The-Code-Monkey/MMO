name: Server & Client Builds

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/andy/Documents/GitHub/MMO
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Server (Linux Dedicated Server)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: Assets

      - name: Build Client (Windows Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          projectPath: Assets

      - name: Build Client (Linux Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: Assets

      - name: Upload server build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-server-build
          path: build/StandaloneLinux64/MMO.exe
          if-no-files-found: warn

      - name: Upload Windows client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-windows-build
          path: build/StandaloneWindows64/MMO.exe
          if-no-files-found: warn

      - name: Upload Linux client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-linux-build
          path: build/StandaloneLinux64/MMO.x86_64
          if-no-files-found: warn
