name: Server & Client Builds

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      # The unityci editor image plus a Unity project does not fit on a stock hosted
      # runner (~14 GB). Remove preinstalled toolchains the build never uses and prune
      # Docker before the editor image is pulled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # The Unity MCP packages are a local editor tool: their NuGet DLLs live under
      # Assets/Plugins/NuGet but are gitignored, so a clean CI checkout has none of them and
      # the package fails to compile. They are not used by tests or builds; drop them here.
      - name: Drop editor-only MCP packages
        run: |
          jq 'del(.dependencies["com.ivanmurzak.unity.mcp"], .dependencies["com.ivanmurzak.unity.mcp.navigation"], .dependencies["com.ivanmurzak.unity.mcp.terrain"])' \
            Packages/manifest.json > Packages/manifest.ci.json
          mv Packages/manifest.ci.json Packages/manifest.json

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Server (Linux Dedicated Server)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .
          cliVersion: v0.1.75

      - name: Build Client (Windows Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          projectPath: .
          cliVersion: v0.1.75

      - name: Build Client (Linux Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .
          cliVersion: v0.1.75

      - name: Upload server build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-server-build
          path: build/StandaloneLinux64/MMO.x86_64
          if-no-files-found: warn

      - name: Upload Windows client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-windows-build
          path: build/StandaloneWindows64/MMO.exe
          if-no-files-found: warn

      - name: Upload Linux client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-linux-build
          path: build/StandaloneLinux64/MMO.x86_64
          if-no-files-found: warn
