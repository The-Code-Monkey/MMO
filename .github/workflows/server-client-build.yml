name: Server & Client Builds

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          swap-storage: false

      - name: Checkout repository (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Server (Linux Dedicated Server)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildPath: build/server
          customParameters: -standaloneBuildSubtarget Server
          allowDirtyBuild: true

      - name: Build Client (Windows Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildPath: build/windows
          allowDirtyBuild: true

      - name: Build Client (Linux Standalone)
        uses: game-ci/unity-builder@v6
        env:
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildPath: build/linux
          allowDirtyBuild: true

      - name: Upload server build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-server-build
          path: build/server/MMO.x86_64
          if-no-files-found: warn

      - name: Upload Windows client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-windows-build
          path: build/windows/MMO.exe
          if-no-files-found: warn

      - name: Upload Linux client build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mmo-client-linux-build
          path: build/linux/MMO.x86_64
          if-no-files-found: warn
