name: Unity Tests

on:
  pull_request:
  workflow_dispatch:

# Required by game-ci to publish the test results as a check run on the PR.
permissions:
  contents: read
  checks: write

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode + PlayMode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The unityci editor image plus a Unity project does not fit on a stock hosted
      # runner (~14 GB). Remove preinstalled toolchains the build never uses and prune
      # Docker before the editor image is pulled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # The Unity MCP packages are a local editor tool: their NuGet DLLs live under
      # Assets/Plugins/NuGet but are gitignored, so a clean CI checkout has none of them and
      # the package fails to compile. They are not used by tests or builds; drop them here.
      - name: Drop editor-only MCP packages
        run: |
          jq 'del(.dependencies["com.ivanmurzak.unity.mcp"], .dependencies["com.ivanmurzak.unity.mcp.navigation"], .dependencies["com.ivanmurzak.unity.mcp.terrain"])' \
            Packages/manifest.json > Packages/manifest.ci.json
          mv Packages/manifest.ci.json Packages/manifest.json

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Runs both the EditMode and PlayMode suites (testMode: all).
      # Licensing (GameCI): Unity Personal authenticates with the Unity account, so
      # set repo secrets UNITY_EMAIL + UNITY_PASSWORD. Unity Pro/Plus also needs
      # UNITY_SERIAL. (A UNITY_LICENSE .ulf is Enterprise/Industry-only now.)
      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto # reads ProjectSettings/ProjectVersion.txt (6000.6.5f1)
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results
          # Pin the CLI instead of resolving "latest" through the GitHub API from inside the
          # container: that lookup is rate-limited and returns 403 on hosted runners, which was
          # failing the job before Unity ever started.
          cliVersion: v0.1.75
          # Do not pass coverageEnabled: false: game-ci CLI v0.1.75 rejects the generated
          # --no-coverageEnabled flag and exits before Unity starts. The action's default
          # (coverage on) is accepted by this CLI.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results
          path: test-results
          if-no-files-found: warn
